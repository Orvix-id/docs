name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --no-git scans the tree as checked out rather than the history. The
      # history still holds the secrets that were rotated after the September
      # 2026 disclosure; failing on those forever would only teach people to
      # ignore this job. What matters is that nothing new lands.
      - name: Scan working tree
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --no-git --redact --no-banner --exit-code 1

      - name: Refuse tracked env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::an environment file is tracked; it belongs in .gitignore"
            exit 1
          fi

      # A placeholder secret is not a leak by gitleaks' rules, but shipping one
      # is exactly what turned the disclosure into an account takeover.
      # tests/ is excluded: the guard test has to name the placeholder in
      # order to assert that it is rejected.
      - name: Refuse placeholder secrets
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=tests --exclude='*.example' --exclude=secret-scan.yml \
               -e 'your_secure_jwt_secret_key' \
               -e 'change_me' \
               -e 'CHANGEME' . ; then
            echo "::error::placeholder secret present outside an .example file"
            exit 1
          fi
